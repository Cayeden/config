id = "cayeden/local-services"
name = "Local services"
version = "1.1.0"
plugin_api = 24
author = "cayeden"
description = "Strata model toggle, Docker containers, RiseupVPN, and system resources."
dependencies = ["python3", "systemctl", "docker"]

[[widget]]
id = "strata"
